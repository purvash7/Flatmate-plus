name: Verify liveness build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/verify-liveness-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-liveness-build.yml
          git commit -m "Remove temporary verification build workflow" || true
          git push || true