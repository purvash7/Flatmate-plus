name: Google profile autofill fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Google profile autofill
        run: |
          python3 <<'PY'
          from pathlib import Path

          auth = Path('src/pages/AuthModal.tsx')
          text = auth.read_text()

          marker = "interface AuthModalProps {"
          helper = r'''function decodeGoogleIdToken(idToken: string): { email?: string; name?: string; picture?: string; sub?: string } | null {
            try {
              const parts = idToken.split('.');
              if (parts.length !== 3) return null;
              const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
              const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
              const bytes = Uint8Array.from(atob(padded), char => char.charCodeAt(0));
              return JSON.parse(new TextDecoder().decode(bytes));
            } catch {
              return null;
            }
          }

          '''
          if 'function decodeGoogleIdToken(' not in text:
              text = text.replace(marker, helper + marker, 1)

          old = '''      // Validate message structure
      if (event.data?.type === 'GOOGLE_AUTH_CALLBACK') {
        setLoading(true);
        try {
          const { idToken, accessToken } = event.data;
          // Exchange or register
          await googleLogin(
            googleEmail || 'user@gmail.com',
            googleFullName || 'Google User',
            idToken ? `gid_${idToken.slice(0, 10)}` : undefined
          );
          onSuccess?.();
          onClose();
        } catch (err: any) {
          setError(err.message || 'Google authentication failed.');
        } finally {
          setLoading(false);
        }
      }'''
          new = '''      // Accept callbacks only from the same origin as the app.
      if (event.origin !== window.location.origin) return;
      if (event.data?.type === 'GOOGLE_AUTH_CALLBACK') {
        setLoading(true);
        try {
          const { idToken } = event.data;
          const googleProfile = idToken ? decodeGoogleIdToken(idToken) : null;
          const resolvedEmail = googleProfile?.email || googleEmail || '';
          const resolvedName = googleProfile?.name || googleFullName || resolvedEmail.split('@')[0] || 'Google User';
          const resolvedGoogleId = googleProfile?.sub || undefined;
          const resolvedPhoto = googleProfile?.picture || undefined;

          if (!resolvedEmail) {
            throw new Error('Google did not return an email address. Please try again.');
          }

          // Populate the onboarding name from the Google account profile.
          setName(resolvedName);
          setGoogleEmail(resolvedEmail);
          setGoogleFullName(resolvedName);

          await googleLogin(
            resolvedEmail,
            resolvedName,
            resolvedGoogleId,
            resolvedPhoto
          );
          onSuccess?.();
          onClose();
        } catch (err: any) {
          setError(err.message || 'Google authentication failed.');
        } finally {
          setLoading(false);
        }
      }'''
          if old not in text:
              raise SystemExit('AuthModal callback block not found')
          text = text.replace(old, new, 1)
          auth.write_text(text)

          server = Path('server.ts')
          text = server.read_text()
          old_server = '''      const profile = profiles.get(user.id);
      const token = createAuthToken(user.id);

      res.json({'''
          new_server = '''      const profile = profiles.get(user.id);
      if (profile) {
        // Use the Google profile name as the initial onboarding name.
        // Do not overwrite a name the user has already chosen themselves.
        const currentName = String(profile.name || '').trim();
        if (name?.trim() && (!currentName || currentName === 'Google User' || currentName === 'New Flatmate')) {
          profile.name = name.trim();
        }
        if (photo_url && !profile.main_photo) {
          profile.main_photo = photo_url;
          profile.photos = [{ id: 'gp1', url: photo_url, is_main: true, verified: true }, ...(profile.photos || [])];
        }
        profile.updated_at = new Date().toISOString();
        profiles.set(user.id, profile);
        syncProfileToPostgres(profile);
      }
      users.set(user.id, user);
      syncUserToPostgres(user);

      const token = createAuthToken(user.id);

      res.json({'''
          if old_server not in text:
              raise SystemExit('Google profile response block not found')
          text = text.replace(old_server, new_server, 1)
          server.write_text(text)
          PY
      - name: Typecheck
        run: |
          npm install --no-package-lock
          npm run lint
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AuthModal.tsx server.ts
          git diff --cached --quiet && exit 0
          git commit -m "Autofill Google account name during onboarding"
          git push origin main
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/google-profile-autofill-fix.yml
          git add -u .github/workflows/google-profile-autofill-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Google profile fix workflow"
            git push origin main
          fi
