name: Audit onboarding variable mappings
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and audit onboarding mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OnboardingFlow.tsx')
          s = p.read_text()
          old = 'sleep_schedule:sleepSchedule,social_level,guests,parties,pets,work_schedule,'
          new = 'sleep_schedule:sleepSchedule,social_level:socialLevel,guests,parties,pets,work_schedule:workSchedule,'
          if old not in s:
              raise SystemExit(f'Expected mapping pattern not found: {old}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Static mapping audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('src/pages/OnboardingFlow.tsx').read_text()
          required = {
            'date_of_birth': 'dob',
            'flatmate_gender_preference': 'genderPref',
            'food_preference': 'foodPref',
            'okay_with_nonveg_cooking': 'okayNonVeg',
            'sleep_schedule': 'sleepSchedule',
            'social_level': 'socialLevel',
            'work_schedule': 'workSchedule',
            'attached_washroom': 'attachedWashroom',
            'gated_society': 'gatedSociety',
            'non_negotiables': 'nonNegotiables',
            'house_details': 'houseDetails',
          }
          start = s.index('const updates:Partial<UserProfile>={')
          end = s.index(';', start)
          obj = s[start:end]
          for field, variable in required.items():
              if not re.search(rf'\b{re.escape(field)}\s*:\s*', obj):
                  raise SystemExit(f'Missing explicit mapping for {field}')
              if not re.search(rf'\b{re.escape(field)}\s*:\s*[^,}}]*\b{re.escape(variable)}\b', obj):
                  raise SystemExit(f'Wrong mapping for {field}; expected {variable}')
          for bad in ['social_level,', 'work_schedule,', 'sleep_schedule,']:
              if bad in obj:
                  raise SystemExit(f'Bare shorthand remains: {bad}')
          print('Onboarding profile variable audit passed.')
          PY
      - name: Type-check project
        run: |
          npm install --no-package-lock
          npm run lint
      - name: Remove audit workflow and commit
        run: |
          rm -f .github/workflows/audit-onboarding-variables.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/OnboardingFlow.tsx .github/workflows/audit-onboarding-variables.yml
          git diff --cached --check
          git commit -m "Fix all onboarding profile variable mappings"
          git push
